<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>THE GENERATOR</title>
  <meta name="theme-color" content="#ffffff">

  <!-- PWA（若你有 manifest / sw，可保留） -->
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #f3f3f5;
      /* 防止下拉回彈與位移 */
      overscroll-behavior: none;
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    /* 讓 iframe 自適應，並避免地址列收起/展開引起的跳動 */
    .app-frame {
      width: min(92vw, 760px);
      aspect-ratio: 1 / 1; /* 你的 UI 是方形 */
      border: 0;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      background: #fff;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe
      id="app"
      class="app-frame"
      src="./thegenerator_final.html"
      title="THE GENERATOR"
      allow="autoplay; fullscreen"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>

  <script>
    // 首次使用者手勢 → 通知子頁解鎖 AudioContext
    function sendUnlock(){
      const f = document.getElementById('app');
      try { f.contentWindow.postMessage({ type: 'UNLOCK_AUDIO' }, '*'); } catch(e){}
    }
    window.addEventListener('pointerdown', sendUnlock, { once:true, passive:true });
    window.addEventListener('touchstart', sendUnlock, { once:true, passive:true });
  </script>
</body>
</html>
