<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>THE GENERATOR</title>
<meta name="theme-color" content="#ffffff">

<style>
  :root { --panel:#f2f2f2; --screen:#111; }

  html,body{
    margin:0; height:100%;
    background:linear-gradient(180deg,#ececec,#f8f8f8);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, "Noto Sans TC", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior:none;
  }
  body{ display:grid; place-items:center; }

  /* ====== 等比縮放容器（以 720×720 為基準） ====== */
  #fitBox{
    width:min(92vw, 760px);
    height:min(92vw, 760px);
    position:relative;
    overflow:hidden;
  }
  #fitBox > .unit{
    width:720px; height:720px;
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:center center;
  }

  /* 面板 */
  .unit{
    background:var(--panel);
    border-radius:28px;
    box-shadow:
      inset 0 10px 30px rgba(0,0,0,.12),
      0 14px 40px rgba(0,0,0,.12);
  }

  /* 顯示器 */
  .screen{
    position:absolute; left:24px; right:24px; top:24px; height:34%;
    background:var(--screen);
    border-radius:20px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05), inset 0 0 40px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .badge{
    position:absolute; left:20px; top:14px;
    font-size:12px; color:#bfe2ff;
    background:#1b1b1b; border:1px solid #333; border-radius:999px;
    padding:6px 10px; letter-spacing:.1em;
    user-select:none;
  }

  /* M / S 鈕 */
  .chip{ position:absolute; width:44px; height:44px; border-radius:50%;
    left: calc(50% - 170px); top:calc(34% + 52px);
    background:radial-gradient(circle at 35% 35%, #fff,#e5e5e5);
    display:grid; place-items:center; color:#444; font-weight:700;
    box-shadow:0 1px 2px rgba(0,0,0,.2), inset 0 4px 8px rgba(0,0,0,.15);
    user-select:none; cursor:pointer;
  }
  .chip.s{ left:auto; right: calc(50% - 170px); }

  /* 旋鈕 */
  .knob{ --size:120px; position:absolute; width:var(--size); height:var(--size); user-select:none; }
  .knob .dial{
    width:100%; height:100%; border-radius:50%;
    background:radial-gradient(circle at 36% 36%, #fff, #d7d7d7);
    box-shadow: 0 3px 12px rgba(0,0,0,.25), inset 0 8px 16px rgba(0,0,0,.18);
    position:relative; cursor:grab; touch-action:none;
  }
  .knob .cap{
    position:absolute; inset:14px; border-radius:50%;
    background:radial-gradient(circle at 36% 36%, #fff, #cfcfcf);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.25);
  }
  .knob .tick{
    position:absolute; top:8px; left:50%; width:3px; height:14px;
    background:#101010; border-radius:2px; transform:translateX(-50%);
  }
  .readout{ text-align:center; margin-top:10px; color:#555; font-weight:600; font-size:14px; letter-spacing:.08em; }

  /* 位置 */
  .knob.center{ --size:210px; left:50%; top:55%; transform:translate(-50%,-50%); }
  .knob.left  { --size:120px; left:150px; bottom:86px; }
  .knob.right { --size:120px; right:150px; bottom:86px; }

  /* 品牌區 */
  .brandStack{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px; color:#333;
  }
  .brandStack .name{ font-weight:700; letter-spacing:.20em; font-size:16px; }
  .brandStack .brand{ font-size:12px; letter-spacing:.18em; color:#666; }
</style>
</head>

<body>
  <div id="fitBox">
    <div class="unit" id="unit">
      <div class="screen"><div class="badge">DYNAMIC</div></div>

      <div class="chip" id="muteBtn" title="Mute">M</div>
      <div class="chip s" id="startBtn" title="Start/Stop">S</div>

      <div class="knob left"  id="waveKnob" data-label="SINE"></div>
      <div class="knob center" id="freqKnob" data-label="1 kHz"></div>
      <div class="knob right" id="volKnob"  data-label="VOL -6.0 dB"></div>

      <div class="brandStack">
        <div class="name">THE GENERATOR</div>
        <div class="brand">Designed by YO</div>
      </div>
    </div>
  </div>

<script>
/* ===== 等比縮放 ===== */
(function(){
  function fit(){
    const box  = document.getElementById('fitBox');
    const unit = document.getElementById('unit');
    if(!box || !unit) return;
    const s = Math.min(box.clientWidth, box.clientHeight) / 720;
    unit.style.transform = 'translate(-50%,-50%) scale('+s+')';
  }
  window.addEventListener('load', fit, {passive:true});
  window.addEventListener('resize', fit, {passive:true});
  window.addEventListener('orientationchange', fit, {passive:true});
})();

/* ===== 旋鈕外觀建立 ===== */
(function(){
  document.querySelectorAll('.knob').forEach(k=>{
    const dial = document.createElement('div'); dial.className='dial';
    const cap  = document.createElement('div'); cap.className='cap';
    const tick = document.createElement('div'); tick.className='tick';
    const ro   = document.createElement('div'); ro.className='readout';
    ro.textContent = k.dataset.label || '';
    dial.appendChild(cap); dial.appendChild(tick);
    k.appendChild(dial); k.appendChild(ro);
  });
})();

/* ===== Web Audio：僅在用戶手勢時 resume ===== */
const Audio = {
  ctx:null, osc:null, gain:null, running:false, muted:false,
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.gain = this.ctx.createGain(); this.gain.gain.value = dbToLin(-6);
    this.gain.connect(this.ctx.destination);
  },
  async resume(){
    this.ensure();
    if(this.ctx.state !== 'running'){
      try{ await this.ctx.resume(); }catch(e){}
    }
  },
  start(){
    if(this.running) return;
    // 每次新建 oscillator，避免 stop 後無法再 start 的相容性問題
    this.osc = this.ctx.createOscillator();
    this.osc.type = state.wave;
    this.osc.frequency.value = state.freq;
    this.osc.connect(this.gain);
    this.osc.start();
    this.running = true;
  },
  stop(){
    if(!this.running) return;
    try{ this.osc.stop(); }catch(e){}
    try{ this.osc.disconnect(); }catch(e){}
    this.running = false;
  },
  setFreq(v){ if(this.osc) this.osc.frequency.value = v; },
  setWave(t){ if(this.osc) this.osc.type = t; },
  setGainDb(db){ if(this.gain && !this.muted) this.gain.gain.value = dbToLin(db); },
  mute(on){
    this.muted = on;
    if(this.gain){
      this.gain.gain.value = on ? 0 : dbToLin(state.db);
    }
  }
};
function dbToLin(db){ return Math.pow(10, db/20); }

/* ===== 參數狀態 ===== */
const state = { wave:'sine', freq:1000, db:-6 };

/* ===== 旋鈕互動 ===== */
(function(){
  function setupKnob(k, onChange, initialDeg){
    const dial = k.querySelector('.dial');
    let dragging=null, base=0;

    const toDeg = (cx,cy,x,y)=>Math.atan2(y-cy,x-cx)*180/Math.PI + 90;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    function setDeg(deg){ dial.style.transform = `rotate(${deg}deg)`; dial._deg = deg; }

    function onDown(e){
      // 嘗試先恢復 AudioContext（任何手勢都觸發）
      Audio.resume();
      const r=dial.getBoundingClientRect();
      dragging = { cx:r.left+r.width/2, cy:r.top+r.height/2 };
      base = (dial._deg||0) - toDeg(dragging.cx,dragging.cy,
              (e.touches?e.touches[0].clientX:e.clientX),
              (e.touches?e.touches[0].clientY:e.clientY));
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      const x=(e.touches?e.touches[0].clientX:e.clientX);
      const y=(e.touches?e.touches[0].clientY:e.clientY);
      let deg = base + toDeg(dragging.cx,dragging.cy,x,y);
      deg = clamp(deg, -135, 135);
      setDeg(deg);
      onChange( (deg+135)/270 ); // 0~1
    }
    function onUp(){ dragging=null; }

    dial.addEventListener('pointerdown', onDown, {passive:false});
    dial.addEventListener('touchstart',  onDown, {passive:false});
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('touchmove',  onMove, {passive:false});
    window.addEventListener('pointerup',  onUp,   {passive:true});
    window.addEventListener('touchend',   onUp,   {passive:true});

    setDeg(initialDeg ?? 0);
  }

  // 左：波形（四段）
  const waveLabels = ['SINE','SQUARE','TRI','SAW'];
  setupKnob(document.getElementById('waveKnob'), (t)=>{
    const idx = Math.min(3, Math.max(0, Math.round(t*3)));
    const types = ['sine','square','triangle','sawtooth'];
    state.wave = types[idx];
    document.querySelector('#waveKnob .readout').textContent = waveLabels[idx];
    Audio.setWave(state.wave);
  }, -120);

  // 中：頻率（20Hz~16kHz，對數）
  setupKnob(document.getElementById('freqKnob'), (t)=>{
    const f = lerpLog(20, 16000, t);
    state.freq = Math.round(f);
    document.querySelector('#freqKnob .readout').textContent = formatHz(state.freq);
    Audio.setFreq(state.freq);
  }, 10);

  // 右：音量（-60dB~0dB）
  setupKnob(document.getElementById('volKnob'), (t)=>{
    const db = Math.round( -60 + t*60 ); // -60 ~ 0
    state.db = db;
    document.querySelector('#volKnob .readout').textContent = `VOL ${db} dB`;
    Audio.setGainDb(db);
  }, -10);
})();

function lerpLog(min,max,t){
  const a = Math.log(min), b = Math.log(max);
  return Math.exp(a + (b-a)*t);
}
function formatHz(f){
  if(f>=1000) return (f/1000).toFixed(f%1000?1:0)+' kHz';
  return f+' Hz';
}

/* ===== Mute / Start・Stop ===== */
document.getElementById('muteBtn').addEventListener('click', async ()=>{
  await Audio.resume();
  Audio.mute(!Audio.muted);
  document.getElementById('muteBtn').style.opacity = Audio.muted? .55 : 1;
});
document.getElementById('startBtn').addEventListener('click', async ()=>{
  await Audio.resume();
  if(Audio.running){ Audio.stop(); }
  else{ Audio.start(); }
  document.getElementById('startBtn').style.opacity = Audio.running? 1 : .55;
});

/* ===== 頁面返回可見時自動恢復（避免手機切出去後沒聲音） ===== */
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState === 'visible' && Audio.running){
    await Audio.resume();
  }
});

/* 初始 readout 與按鈕狀態 */
(function initLabels(){
  document.querySelector('#waveKnob .readout').textContent = 'SINE';
  document.querySelector('#freqKnob .readout').textContent = '1 kHz';
  document.querySelector('#volKnob  .readout').textContent = 'VOL -6.0 dB';
  document.getElementById('startBtn').style.opacity = .55;
})();
</script>
</body>
</html>
