<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>THE GENERATOR — Signal Generator</title>
<meta name="theme-color" content="#ffffff">

<style>
  :root { --panel:#f2f2f2; --screen:#111; }

  html,body{
    margin:0; height:100%;
    background:linear-gradient(180deg,#ececec,#f8f8f8);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, "Noto Sans TC", sans-serif;
    -webkit-text-size-adjust:100%;
  }
  body{ display:grid; place-items:center; overscroll-behavior:none; }

  /* === 等比縮放：設計稿 720x720 === */
  #box{ width:min(92vw,760px); height:min(92vw,760px); position:relative; overflow:hidden; }
  #unit{ width:720px; height:720px; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(1); transform-origin:center; }

  /* 機身 */
  .unit{
    background:var(--panel);
    border-radius:28px;
    box-shadow: inset 0 10px 34px rgba(0,0,0,.12), 0 16px 40px rgba(0,0,0,.12);
  }

  /* 顯示器 */
  .screen{
    position:absolute; left:24px; right:24px; top:24px; height:34%;
    background:var(--screen);
    border-radius:20px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.05), inset 0 0 40px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .badge{
    position:absolute; left:20px; top:14px;
    font-size:12px; color:#bfe2ff; background:#1b1b1b; border:1px solid #333;
    border-radius:999px; padding:6px 10px; letter-spacing:.1em; user-select:none;
  }
  canvas#scope, canvas#spectrum { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #spectrum { pointer-events:none; }

  .chip{
    position:absolute; width:44px; height:44px; border-radius:50%;
    left: calc(50% - 170px); top:calc(34% + 52px);
    background:radial-gradient(circle at 35% 35%, #fff,#e5e5e5);
    display:grid; place-items:center; color:#444; font-weight:700;
    box-shadow:0 1px 2px rgba(0,0,0,.2), inset 0 4px 8px rgba(0,0,0,.15);
    user-select:none; cursor:pointer;
  }
  .chip.s{ left:auto; right: calc(50% - 170px); }

  /* 旋鈕 */
  .knob{ --size:120px; position:absolute; width:var(--size); height:var(--size); user-select:none; }
  .dial{
    width:100%; height:100%; border-radius:50%;
    background:radial-gradient(circle at 36% 36%, #fff, #d7d7d7);
    box-shadow: 0 3px 12px rgba(0,0,0,.25), inset 0 8px 16px rgba(0,0,0,.18);
    position:relative; cursor:grab; touch-action:none;
  }
  .cap{
    position:absolute; inset:14px; border-radius:50%;
    background:radial-gradient(circle at 36% 36%, #fff, #cfcfcf);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.25);
  }
  .tick{
    position:absolute; top:8px; left:50%; width:3px; height:14px;
    background:#101010; border-radius:2px; transform:translateX(-50%);
  }
  .readout{ text-align:center; margin-top:10px; color:#555; font-weight:600; font-size:14px; letter-spacing:.08em; }

  .knob.center{ --size:210px; left:50%; top:55%; transform:translate(-50%,-50%); }
  .knob.left  { --size:120px; left:150px; bottom:86px; }
  .knob.right { --size:120px; right:150px; bottom:86px; }

  /* 品牌 */
  .brandStack{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%); text-align:center; color:#333; }
  .brandStack .name{ font-weight:700; letter-spacing:.20em; font-size:16px; }
  .brandStack .brand{ font-size:12px; letter-spacing:.18em; color:#666; }

  /* 行動裝置：避免 Safari 字體縮放造成位移 */
  @supports (-webkit-touch-callout: none) {
    .readout{ font-size:13px; }
  }
</style>
</head>
<body>
  <div id="box">
    <div class="unit" id="unit">
      <div class="screen">
        <div class="badge">DYNAMIC</div>
        <canvas id="scope" width="1200" height="500"></canvas>
        <canvas id="spectrum" width="1200" height="500"></canvas>
      </div>

      <div class="chip" id="muteBtn" title="Mute">M</div>
      <div class="chip s" id="startBtn" title="Start / Stop">S</div>

      <div class="knob left"  id="waveKnob" data-label="SINE"></div>
      <div class="knob center" id="freqKnob" data-label="1 kHz"></div>
      <div class="knob right" id="volKnob"  data-label="VOL -6.0 dB"></div>

      <div class="brandStack">
        <div class="name">THE GENERATOR</div>
        <div class="brand">Designed by YO</div>
      </div>
    </div>
  </div>

<script>
/* ===================== 版面等比縮放 ===================== */
(function(){
  function fit(){
    const box  = document.getElementById('box');
    const unit = document.getElementById('unit');
    const s = Math.min(box.clientWidth, box.clientHeight) / 720;
    unit.style.transform = 'translate(-50%,-50%) scale('+s+')';
  }
  addEventListener('load', fit, {passive:true});
  addEventListener('resize', fit, {passive:true});
  addEventListener('orientationchange', fit, {passive:true});
})();

/* ===================== 建立旋鈕外觀 ===================== */
(function(){
  document.querySelectorAll('.knob').forEach(k=>{
    const dial = document.createElement('div'); dial.className='dial';
    const cap  = document.createElement('div'); cap.className='cap';
    const tick = document.createElement('div'); tick.className='tick';
    const ro   = document.createElement('div'); ro.className='readout';
    ro.textContent = k.dataset.label || '';
    dial.appendChild(cap); dial.appendChild(tick);
    k.appendChild(dial); k.appendChild(ro);
  });
})();

/* ===================== Web Audio Core ===================== */
const AudioCore = {
  ctx:null, osc:null, gain:null, analyser:null, running:false, muted:false,
  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.gain = this.ctx.createGain();
    this.gain.gain.value = dbToLin(-6);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048;
    this.analyser.smoothingTimeConstant = 0.6;
    this.gain.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
  },
  async resume(){
    this.ensure();
    if(this.ctx.state !== 'running'){
      try{ await this.ctx.resume(); }catch(e){}
    }
  },
  start(){
    if(this.running) return;
    this.osc = this.ctx.createOscillator();
    this.osc.type = state.wave;
    this.osc.frequency.value = state.freq;
    this.osc.connect(this.gain);
    this.osc.start();
    this.running = true;
  },
  stop(){
    if(!this.running) return;
    try{ this.osc.stop(); }catch(e){}
    try{ this.osc.disconnect(); }catch(e){}
    this.running = false;
  },
  setWave(t){ if(this.osc) this.osc.type = t; },
  setFreq(f){ if(this.osc) this.osc.frequency.value = f; },
  setGainDb(db){
    if(!this.gain) return;
    const v = this.muted ? 0 : dbToLin(db);
    try{ this.gain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.01); }
    catch{ this.gain.gain.value = v; }
  },
  mute(on){
    this.muted = on;
    this.setGainDb(state.db);
  }
};
function dbToLin(db){ return Math.pow(10, db/20); }

/* ===================== 狀態 ===================== */
const state = { wave:'sine', freq:1000, db:-6 };

/* ===================== 旋鈕互動 ===================== */
(function(){
  function setupKnob(k, onChange, initialDeg){
    const dial = k.querySelector('.dial');
    let dragging=null, base=0;

    const toDeg = (cx,cy,x,y)=>Math.atan2(y-cy,x-cx)*180/Math.PI + 90;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    function setDeg(deg){ dial.style.transform = `rotate(${deg}deg)`; dial._deg = deg; }

    function onDown(e){
      AudioCore.resume();
      const ev = e.touches? e.touches[0]: e;
      const r=dial.getBoundingClientRect();
      dragging = { cx:r.left+r.width/2, cy:r.top+r.height/2 };
      base = (dial._deg||0) - toDeg(dragging.cx,dragging.cy,ev.clientX,ev.clientY);
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      const ev = e.touches? e.touches[0]: e;
      let deg = base + toDeg(dragging.cx,dragging.cy,ev.clientX,ev.clientY);
      deg = clamp(deg, -135, 135);
      setDeg(deg);
      onChange( (deg+135)/270 ); // 0~1
    }
    function onUp(){ dragging=null; }

    dial.addEventListener('pointerdown', onDown, {passive:false});
    dial.addEventListener('touchstart',  onDown, {passive:false});
    addEventListener('pointermove', onMove, {passive:false});
    addEventListener('touchmove',  onMove, {passive:false});
    addEventListener('pointerup',  onUp,   {passive:true});
    addEventListener('touchend',   onUp,   {passive:true});

    setDeg(initialDeg ?? 0);
  }

  // 波形（四段）
  const waveLabels = ['SINE','SQUARE','TRI','SAW'];
  setupKnob(document.getElementById('waveKnob'), (t)=>{
    const idx = Math.min(3, Math.max(0, Math.round(t*3)));
    const types = ['sine','square','triangle','sawtooth'];
    state.wave = types[idx];
    document.querySelector('#waveKnob .readout').textContent = waveLabels[idx];
    AudioCore.setWave(state.wave);
  }, -120);

  // 頻率（20Hz~16kHz 對數）
  setupKnob(document.getElementById('freqKnob'), (t)=>{
    const f = lerpLog(20, 16000, t);
    state.freq = Math.round(f);
    document.querySelector('#freqKnob .readout').textContent = formatHz(state.freq);
    AudioCore.setFreq(state.freq);
  }, 10);

  // 音量（-60~0 dB）
  setupKnob(document.getElementById('volKnob'), (t)=>{
    const db = Math.round( -60 + t*60 );
    state.db = db;
    document.querySelector('#volKnob .readout').textContent = `VOL ${db} dB`;
    AudioCore.setGainDb(db);
  }, -10);
})();

function lerpLog(min,max,t){
  const a = Math.log(min), b = Math.log(max);
  return Math.exp(a + (b-a)*t);
}
function formatHz(f){
  if(f>=1000) return (f/1000).toFixed(f%1000?1:0)+' kHz';
  return f+' Hz';
}

/* ===================== Mute / Start ===================== */
const muteBtn  = document.getElementById('muteBtn');
const startBtn = document.getElementById('startBtn');

muteBtn.addEventListener('click', async ()=>{
  await AudioCore.resume();
  AudioCore.mute(!AudioCore.muted);
  muteBtn.style.opacity = AudioCore.muted? .55 : 1;
});
startBtn.addEventListener('click', async ()=>{
  await AudioCore.resume();
  if(AudioCore.running){ AudioCore.stop(); }
  else{ AudioCore.start(); }
  startBtn.style.opacity = AudioCore.running? 1 : .55;
});

/* 回到頁面可見時，若正在播放就 resume（行動裝置切 app 回來） */
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState === 'visible' && AudioCore.running){
    await AudioCore.resume();
  }
});

/* ===================== 簡易示波 / 頻譜 ===================== */
(function(){
  const scope = document.getElementById('scope');
  const spec  = document.getElementById('spectrum');
  const sc = scope.getContext('2d');
  const sp = spec.getContext('2d');

  function drawGrid(ctx){
    const W=scope.width, H=scope.height;
    ctx.clearRect(0,0,W,H);
    // 背景線
    ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<=10;i++){ const y=H*i/10; ctx.moveTo(0,y); ctx.lineTo(W,y); }
    for(let i=0;i<=20;i++){ const x=W*i/20; ctx.moveTo(x,0); ctx.lineTo(x,H); }
    ctx.stroke();
    // 中線
    ctx.strokeStyle='rgba(80,170,255,.9)';
    ctx.beginPath(); ctx.moveTo(0,H*0.5); ctx.lineTo(W,H*0.5); ctx.stroke();
  }

  function loop(){
    requestAnimationFrame(loop);
    drawGrid(sc);

    if(!AudioCore.analyser) return;
    const an = AudioCore.analyser;

    // scope
    const t = new Uint8Array(an.fftSize);
    an.getByteTimeDomainData(t);
    sc.strokeStyle='#30d158'; sc.lineWidth=2; sc.beginPath();
    const W=scope.width, H=scope.height;
    for(let i=0;i<t.length;i++){
      const x = i/(t.length-1)*W;
      const y = (t[i]/255)*H;
      (i?sc.lineTo:sc.moveTo).call(sc, x, y);
    }
    sc.stroke();

    // spectrum
    const f = new Uint8Array(an.frequencyBinCount);
    an.getByteFrequencyData(f);
    sp.clearRect(0,0,spec.width,spec.height);
    sp.fillStyle='rgba(90,200,90,.8)';
    const binW = spec.width/f.length;
    for(let i=0;i<f.length;i++){
      const h = (f[i]/255)*spec.height;
      sp.fillRect(i*binW, spec.height-h, binW, h);
    }
  }
  loop();
})();

/* ===== 初始文字與按鈕狀態 ===== */
(function(){
  document.querySelector('#waveKnob .readout').textContent = 'SINE';
  document.querySelector('#freqKnob .readout').textContent = '1 kHz';
  document.querySelector('#volKnob  .readout').textContent = 'VOL -6.0 dB';
  startBtn.style.opacity = .55;
})();

</script>
</body>
</html>
