<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>THE GENERATOR</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="./pwa-icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./pwa-icons/icon-192.png">

  <!-- 基本樣式：把 720×720 的 UI 等比縮在方形框裡 -->
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #f4f4f4; }
    body { display: grid; place-items: center; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }

    /* 外框：自適應螢幕但維持正方形 */
    #fitBox {
      width: min(92vw, 760px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: #f2f2f2;
      box-shadow:
        inset 0 10px 30px rgba(0,0,0,.08),
        0 16px 40px rgba(0,0,0,.14);
      overflow: hidden; /* 防止縮放溢出 */
    }

    /* 內層就是你原本的 720×720 介面（以 iframe 放入） */
    #ui {
      width: 720px;     /* 固定基準尺寸 */
      height: 720px;
      border: 0;
      transform-origin: center center; /* 讓 scale 以中心縮放 */
      will-change: transform;
      background: transparent;
      /* 在 iOS 上避免雙指縮放導致抖動 */
      touch-action: none;
    }

    /* 頁面頂部安裝提示（可選） */
    #installBanner {
      position: fixed; inset: 12px auto auto 12px;
      display: none; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 12px;
      background: #111; color: #fff; font-size: 13px;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    #installBanner button{
      appearance: none; border: 0; border-radius: 10px;
      padding: 6px 10px; font-size: 12px; cursor: pointer;
      background: #fff; color: #111;
    }
  </style>
</head>

<body>
  <div id="installBanner">
    可安裝為 App
    <button id="installBtn">安裝</button>
  </div>

  <!-- 方形容器 + 你的成品頁（thegenerator_final.html） -->
  <div id="fitBox">
    <iframe id="ui" title="THE GENERATOR UI" src="./thegenerator_final.html" allow="autoplay"></iframe>
  </div>

  <script>
    // === 1) 等比縮放 720×720 介面 ===
    function fit() {
      var box  = document.getElementById('fitBox');
      var ui   = document.getElementById('ui');
      if (!box || !ui) return;
      var s = box.clientWidth / 720;           // 以寬度計算比例
      ui.style.transform = 'scale(' + s + ')'; // 等比縮放
    }
    window.addEventListener('load', fit);
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);

    // === 2) 行動瀏覽器 AudioContext 喚醒：點一下外層就通知內頁 ===
    function unlockAudio() {
      var ui = document.getElementById('ui');
      if (ui && ui.contentWindow) {
        ui.contentWindow.postMessage({ type: 'UNLOCK_AUDIO' }, '*');
      }
    }
    window.addEventListener('pointerdown', unlockAudio, { passive: true });
    window.addEventListener('touchstart',  unlockAudio, { passive: true });

    // === 3) PWA：安裝提示（可選） ===
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('installBanner');
      banner.style.display = 'flex';
    });
    document.getElementById('installBtn')?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      await deferredPrompt.prompt();
      deferredPrompt = null;
      document.getElementById('installBanner').style.display = 'none';
    });

    // === 4) 註冊 Service Worker ===
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(console.error);
      });
    }
  </script>
</body>
</html>
