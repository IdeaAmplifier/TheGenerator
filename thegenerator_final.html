<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SigGen — 1/3 Octave Signal Generator</title>
<style>
  :root { --panel:#f2f2f2; --screen:#111; }
  * { box-sizing: border-box; user-select: none; }
  body { margin:0; background:linear-gradient(180deg,#eaeaea,#f8f8f8); min-height:100vh; display:grid; place-items:center; font-family:Inter,system-ui,Helvetica,Arial,sans-serif; }
  .unit { width:min(92vw,720px); aspect-ratio:1/1; background:var(--panel); border-radius:24px; box-shadow:0 8px 30px rgba(0,0,0,0.18) inset, 0 10px 30px rgba(0,0,0,0.10); padding:20px; position:relative; }
  .screen { position:absolute; left:24px; right:24px; top:24px; height:34%; background:var(--screen); border-radius:18px; box-shadow:inset 0 0 0 2px rgba(255,255,255,0.05), inset 0 0 40px rgba(0,0,0,0.6); overflow:hidden; }
  .screen canvas { width:100%; height:100%; display:block; }
  .screen .corner { position:absolute; right:14px; bottom:10px; color:#bbb; font-size:14px; letter-spacing:.12em; }
  .scopeBtn { position:absolute; left:12px; top:10px; padding:6px 10px; border-radius:999px; border:1px solid #3a3a3a; background:#1b1b1b; color:#bfe2ff; font-size:12px; letter-spacing:.08em; cursor:pointer; }
  .mute { position:absolute; left: calc(50% - 170px); top:calc(34% + 52px); width:44px; height:44px; border-radius:50%; border:none; background:radial-gradient(circle at 35% 35%, #fff, #e5e5e5); box-shadow:0 1px 2px rgba(0,0,0,.2), inset 0 4px 8px rgba(0,0,0,.15); cursor:pointer; }
  .mute.active { background:radial-gradient(circle at 35% 35%, #c6c6c6, #a9a9a9); }
  .mute::after { content:'M'; font-weight:700; color:#444; }
  .label-under { position:absolute; left:calc(50% - 170px); top: calc(55% + 52px); width:44px; text-align:center; font-size:12px; letter-spacing:.12em; color:#666; }
  .knob { --size:120px; position:absolute; width:var(--size); height:var(--size); }
  .knob .dial { width:100%; height:100%; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fdfdfd,#d8d8d8); box-shadow: 0 2px 10px rgba(0,0,0,.25), inset 0 6px 14px rgba(0,0,0,.2); position:relative; cursor:grab; transition:transform .06s linear; transform: rotate(0deg); }
  .knob .cap { position:absolute; inset:14px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #ffffff, #cfcfcf); box-shadow:inset 0 2px 8px rgba(0,0,0,.25); }
  .knob .tick { position:absolute; top:8px; left:50%; width:3px; height:14px; background:#111; border-radius:2px; transform:translateX(-50%); }
  .readout { text-align:center; margin-top:10px; color:#555; font-weight:600; font-size:14px; letter-spacing:.08em; }
  .knob.center { --size:210px; left:50%; top:55%; transform:translate(-50%,-50%); }
  .knob.left   { --size:120px; left: 150px; bottom: 86px; }
  .knob.right  { --size:120px; right: 150px; bottom: 86px; }
  .brandStack { position:absolute; left:50%; bottom: 0px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; color:#333; }
  .brandStack img { height: 116px; }
  .brandStack .brand { font-size:16px; letter-spacing:.08em; }
  .brandStack .name  { font-weight:700; letter-spacing:.20em; font-size:16px; }
  .tooltip { position:absolute; top:calc(34% + 22px); right:28px; font-size:12px; color:#97c8e6; }
  @media (max-width:520px){ .knob.center{ --size:190px; } .knob.left{ left:96px; bottom:60px; } .knob.right{ right:96px; bottom:60px; } .brandStack img { height:180px; } }

.brandStack .tagline{
  font-size:12px;
  letter-spacing:.18em;
  color:#555;
  text-transform:uppercase;
  margin-top:2px;
}


/* FFT toggle */
.modeBtn{
  position:absolute;
  right:12px;
  top:10px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid #3a3a3a;
  background:#1b1b1b;
  color:#bfe2ff;
  font-size:12px;
  letter-spacing:.08em;
  cursor:pointer;
  z-index:5;
}
/* Ensure canvases align perfectly in the screen */

.screen #scope, .screen #spectrum { position:absolute; inset:0; width:100%; height:100%; display:block; }


/* Screen position fix */
.screen {
  position: absolute !important;
  left: 24px !important;
  right: 24px !important;
  top: 24px !important;
  height: 34% !important;
  background: var(--screen);
  border-radius: 18px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05), inset 0 0 40px rgba(0,0,0,0.6);
  overflow: hidden;
}
/* Ensure canvases align to the screen bounds */
#scope, #spectrum { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; display: block !important; }


/* Keep both canvases visible and aligned */
.screen #scope, .screen #spectrum { position:absolute; inset:0; width:100%; height:100%; display:block; }
/* Spectrum on top, non-interactive */
#scope { z-index: 1 !important; }
#spectrum { z-index: 2 !important; pointer-events: none !important; }


/* Ensure scope toggle button is clickable above canvases */
.scopeBtn { z-index: 10 !important; position: absolute; }
/* Canvases should not intercept clicks */
#scope, #spectrum { pointer-events: none !important; }


/* Frequency axis (ISO 1/3) at bottom of screen */
.freq-axis{
  position:absolute;
  left:0; right:0; bottom:4px;
  height:16px;
  font-size:10px;
  color:#b8c2cc;
  pointer-events:none;
  z-index:4; /* above canvases, below buttons */
}
.freq-axis .tick{
  position:absolute;
  bottom:0;
  transform:translateX(-50%);
  text-align:center;
  white-space:nowrap;
  opacity:.85;
}
.freq-axis .tick::before{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:14px;
  width:1px;
  height:6px;
  background:#56606a;
  opacity:.8;
}
@media (max-width:520px){
  .freq-axis{ font-size:9px; }
}


/* New always-on FFT overlay */
#spectrum2{ position:absolute; inset:0; width:100%; height:100%;
  z-index: 5; pointer-events:none; display:block; }


/* Prompt effect for Mute when sweep requires it */
@keyframes mutePulse {
  0% { box-shadow:0 0 0 0 rgba(255,80,80,.0); }
  50%{ box-shadow:0 0 0 6px rgba(255,80,80,.25); }
  100%{ box-shadow:0 0 0 0 rgba(255,80,80,.0); }
}
.mutePulse { animation: mutePulse 650ms ease-out 1; }


/* Disabled state for Sweep button when Mute is OFF */
.sweepDisabled { opacity: .45 !important; pointer-events: none !important; }

</style>

<style id="siggen-hide-labels">
  .label-under, .brandStack .brand, .brandStack .name { display: none !important; }
</style>


<style id="layout-patch-v18">
/* Increase screen height by ~10px */
.screen { height: calc(34% +  15px) !important; }
/* Move center frequency knob and mute button down by 10px */
.knob.center { top: calc(55% + 10px) !important; }
.mute { top: calc(55% + 16px) !important; } /* was +6px, now +16px = +10px */
</style>


<style id="layout-patch-v20">
/* Frequency knob: +15px from original */
.knob.center { top: calc(55% + 15px) !important; }
/* Mute button: back to +6px (10px up from previous +16px) */
.mute { top: calc(55% + 6px) !important; }
</style>


<style id="layout-patch-v21">
/* Mute: up 15px from previous +6px => -9px relative to 55% anchor */
.mute { top: calc(55% - 9px) !important; }
</style>


<style id="layout-patch-v22">
/* Mute: up an extra 30px => top: calc(55% - 39px) */
.mute { top: calc(55% -  59px) !important; }
</style>


<style id="screen-wider-2px">
/* Widen oscilloscope screen by 2px on each side to avoid label clipping */
.screen { left: 22px !important; right: 22px !important; }
</style>


<style id="logo-tweak-80pct-up20">
.brandStack img{
  opacity:0.65 !important;
  transform: translateY(-20px) scale(0.8);
  transform-origin: center center;
}
</style>



<style id="logo-caption-styles">
.brandStack{ display:flex; flex-direction:column; align-items:center; justify-content:center; }
.brandStack .logoCaption{ margin-top:4px; text-align:center; line-height:1.15; }
.brandStack .genTitle{ font-size:12px; letter-spacing:2px; color:#60656b; text-transform:uppercase; }
.brandStack .genBy{ margin-top:3px; font-size:11px; letter-spacing:1.1px; color:#7a7f86; }
</style>


<style id="caption-up20">
.brandStack .logoCaption{ margin-top:-16px !important; } /* previously ~4px; 4 - 20 = -16 */
</style>


<style id="logo-move-down20">
.brandStack img{
  transform: translateY(0px) scale(0.8) !important;
  transform-origin: center center !important;
}
</style>

</head>

<script>
(()=>{
  const fmtHz = f => (f>=1000 ? (f%1000===0? (f/1000)+' kHz' : (f/1000).toFixed(2)+' kHz') : Math.round(f)+' Hz');
  const toDb = v => v<=0 ? -Infinity : 20*Math.log10(v);
  const clamp = (v,min,max)=>Math.min(max,Math.max(min,v));
  const ISO = [20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500, 16000, 20000];
  const AC = new (window.AudioContext || window.webkitAudioContext)();
  const osc = AC.createOscillator(); const gain = AC.createGain(); const analyser = AC.createAnalyser();
  analyser.fftSize = 2048; osc.connect(gain).connect(analyser).connect(AC.destination);
  osc.type = 'sine'; osc.frequency.value = 1000; gain.gain.value = 0.0; osc.start();
  const cvs = document.getElementById('scope'); const ctx = cvs.getContext('2d');
  const buffer = new Uint8Array(analyser.fftSize); let scopeDynamic = true; let lastBuffer = new Uint8Array(analyser.fftSize);
  function captureFrame(){ analyser.getByteTimeDomainData(buffer); lastBuffer.set(buffer); }
  function drawScope(){ const w=cvs.width, h=cvs.height; ctx.clearRect(0,0,w,h);
    ctx.globalAlpha=.25; ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=1; ctx.beginPath();
    for(let x=0;x<w;x+=w/12){ ctx.moveTo(x,0); ctx.lineTo(x,h); } for(let y=0;y<h;y+=h/8){ ctx.moveTo(0,y); ctx.lineTo(w,y); }
    ctx.stroke(); ctx.globalAlpha=1; if(scopeDynamic){ captureFrame(); } const src = scopeDynamic?buffer:lastBuffer;
    ctx.beginPath(); ctx.lineWidth = 3; ctx.strokeStyle='#7cc3ff'; const slice=w/src.length;
    for(let i=0;i<src.length;i++){ const x=i*slice; const v=(src[i]-128)/128; const y=h/2 + v*(h*0.42); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke(); requestAnimationFrame(drawScope); } drawScope();
  const scopeBtn=document.getElementById('scopeBtn'); function updateScopeBtn(){ scopeBtn.textContent=scopeDynamic?'DYNAMIC':'STATIC'; }
  scopeBtn.addEventListener('click',()=>{ scopeDynamic=!scopeDynamic; if(!scopeDynamic) captureFrame(); updateScopeBtn(); });
  window.addEventListener('keydown',(e)=>{ if(e.code==='Space'){ e.preventDefault(); scopeDynamic=!scopeDynamic; if(!scopeDynamic) captureFrame(); updateScopeBtn(); } }); updateScopeBtn();
  function makeKnob(el,onChange){ const dial=el.querySelector('.dial'); const type=el.dataset.type||'continuous'; let value=parseFloat(el.dataset.value||'0');
    const min=parseFloat(el.dataset.min||'0'); const max=parseFloat(el.dataset.max||'1'); const step=parseFloat(el.dataset.step||'0.001');
    const angleMin=-135, angleMax=135; const valueToAngle=v=>angleMin+((v-min)/(max-min))*(angleMax-angleMin);
    const render=()=>{ dial.style.transform=`rotate(${valueToAngle(value)}deg)`; }; render();
    let dragging=false,startY=0,startVal=0;
    function pointerDown(e){ dragging=true; startY=(e.touches?e.touches[0].clientY:e.clientY); startVal=value; dial.style.cursor='grabbing'; e.preventDefault(); }
    function pointerMove(e){ if(!dragging) return; const y=(e.touches?e.touches[0].clientY:e.clientY); const delta=(startY-y);
      const sens=(type==='stepped')?0.02:0.004; let next=startVal+(max-min)*sens*delta; if(type==='stepped') next=Math.round(next);
      value=clamp(next,min,max); render(); onChange(value); }
    function pointerUp(){ dragging=false; dial.style.cursor='grab'; }
    dial.addEventListener('mousedown',pointerDown); window.addEventListener('mousemove',pointerMove); window.addEventListener('mouseup',pointerUp);
    dial.addEventListener('touchstart',pointerDown,{passive:false}); window.addEventListener('touchmove',pointerMove,{passive:false}); window.addEventListener('touchend',pointerUp);
    return { set(v){ value=clamp(v,min,max); render(); onChange(value); }, get(){ return value; }, nudge(stepDir){ value=clamp(value+stepDir,min,max); render(); onChange(value); } }; }
  const waveNames=['SINE','SQUARE','SAW','TRIANGLE']; const waveTypes=['sine','square','sawtooth','triangle'];
  const waveRead=document.getElementById('waveRead'); const wave=makeKnob(document.getElementById('waveKnob'),(v)=>{ const i=Math.round(v); osc.type=waveTypes[i]; waveRead.textContent=waveNames[i]; if(!scopeDynamic) captureFrame(); });
  wave.set(0); waveRead.addEventListener('click',()=>wave.nudge(1));
  const freqRead=document.getElementById('freqRead'); const freq=makeKnob(document.getElementById('freqKnob'),(v)=>{ const i=Math.round(v); const f=ISO[i]; osc.frequency.setTargetAtTime(f, AC.currentTime, 0.01); freqRead.textContent=fmtHz(f); if(!scopeDynamic) captureFrame(); });
  freq.set(17);
  const volRead=document.getElementById('volRead'); let savedVol=0.501187; const vol=makeKnob(document.getElementById('volKnob'),(v)=>{ const db=toDb(v); volRead.textContent=isFinite(db)?`VOL ${db.toFixed(1)} dB`:'VOL -inf dB'; if(!mute) gain.gain.setTargetAtTime(v, AC.currentTime, 0.01); if(!scopeDynamic) captureFrame(); savedVol=v; });
  const muteBtn=document.getElementById('muteBtn'); let mute=true;
  function applyMute(){ if(mute){ gain.gain.setTargetAtTime(0, AC.currentTime, 0.01); muteBtn.classList.add('active'); muteBtn.setAttribute('aria-pressed','true'); } else { gain.gain.setTargetAtTime(savedVol, AC.currentTime, 0.01); muteBtn.classList.remove('active'); muteBtn.setAttribute('aria-pressed','false'); } }
  muteBtn.addEventListener('click',()=>{ mute=!mute; applyMute(); if(!scopeDynamic) captureFrame(); }); applyMute();
  window.addEventListener('pointerdown', ()=>{ if(AC.state!=='running') AC.resume(); }, {once:true});
})();

<script id="siggen-dyn-patch">
(function(){
  function alignMuteLabel(){
    var btn = document.getElementById('muteBtn');
    var label = document.querySelector('.label-under');
    if(!btn || !label) return;
    // Place label 2px below button bottom and horizontally centered
    var btnRect = btn.getBoundingClientRect();
    // Use offsets within .unit to avoid page scroll effects
    var unit = document.querySelector('.unit');
    if(!unit) return;
    var unitRect = unit.getBoundingClientRect();
    var left = (btnRect.left - unitRect.left) + (btnRect.width - 44)/2; // label fixed width: 44px
    var top = (btnRect.top - unitRect.top) + btnRect.height + 2; // 2px gap
    label.style.position = 'absolute';
    label.style.left = left + 'px';
    label.style.top = top + 'px';
    label.style.width = '44px';
    label.style.textAlign = 'center';
  }

<script>
(function(){
  const scope = document.getElementById('scope');
  const spec  = document.getElementById('spectrum');
  const btn   = document.getElementById('modeBtn');
  if(!scope || !spec || !btn) return;

  let mode = 'wave';
  btn.textContent = 'FFT';
  btn.addEventListener('click', ()=>{
    mode = (mode==='wave') ? 'fft' : 'wave';
    if(mode==='fft'){ scope.style.display='none'; spec.style.display='block'; btn.textContent='WAVE'; }
    else { spec.style.display='none'; scope.style.display='block'; btn.textContent='FFT'; }
  });

  const ctx = spec.getContext('2d');
  const grid = '#3a3a3a', trace = '#7cc3ff';

  function parseDb(text){
    // expects like "VOL -8.0 dB"
    const m = /-?\d+(\.\d+)?/.exec(text||"");
    return m ? parseFloat(m[0]) : -Infinity;
  }

  function getUI(){
    const waveText = (document.getElementById('waveRead')||{}).textContent || 'SINE';
    const freqText = (document.getElementById('freqRead')||{}).textContent || '1000 Hz';
    const volText  = (document.getElementById('volRead')||{}).textContent || '-inf';
    const muteBtn  = document.getElementById('muteBtn');
    const muted    = muteBtn ? (muteBtn.getAttribute('aria-pressed')==='true') : true;

    let f = 1000;
    if(/kHz/i.test(freqText)){
      f = parseFloat(freqText)*1000;
    }else{
      const m = /(\d+(\.\d+)?)\s*Hz/i.exec(freqText);
      if(m) f = parseFloat(m[1]);
    }
    const db = parseDb(volText);
    const wave = waveText.trim().toUpperCase();
    return { f, wave, db, muted };
  }

  // Log-x mapping helper
  function xForFreq(f, fmin, fmax, w){
    const ln = Math.log;
    const t = (ln(f) - ln(fmin)) / (ln(fmax) - ln(fmin));
    return Math.max(0, Math.min(1, t)) * w;
  }

  function drawGrid(w,h,fmin,fmax){
    ctx.globalAlpha=.25;
    ctx.strokeStyle=grid;
    ctx.lineWidth=1;
    ctx.beginPath();
    // vertical lines at ISO 1/3 centers for readability
    const iso=[20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
    for(const ff of iso){
      const x=xForFreq(ff,fmin,fmax,w);
      ctx.moveTo(x,0); ctx.lineTo(x,h);
    }
    for(let y=0;y<h;y+=h/8){ ctx.moveTo(0,y); ctx.lineTo(w,y); }
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  function harmonicAmps(type, N){
    // relative amplitudes for harmonics k=1..N (normalized)
    const a=[];
    if(type==='SINE'){
      for(let k=1;k<=N;k++) a.push(k===1?1:0);
    }else if(type==='SQUARE'){
      for(let k=1;k<=N;k++) a.push(k%2===1 ? 1/k : 0);
    }else if(type==='SAW'){
      for(let k=1;k<=N;k++) a.push(1/k);
    }else if(type==='TRIANGLE'){
      for(let k=1;k<=N;k++) a.push(k%2===1 ? 1/(k*k) : 0);
    }
    // normalize so k=1 is 1.0
    const base=a[0]||1;
    return a.map(v=> v/base);
  }

  function drawSpectrum(){
    const {f, wave, db, muted} = getUI();
    const w = spec.width, h = spec.height;
    ctx.clearRect(0,0,w,h);
    const fmin=20, fmax=20000;

    drawGrid(w,h,fmin,fmax);

    ctx.fillStyle = trace;
    ctx.globalAlpha = 1;

    
    // When muted or volume -inf, still draw spectrum but dim
    const dimmed = (muted || !isFinite(db));
    // Convert dB to linear scale (overall height factor)
    const lin = Math.pow(10, db/20);

    // Determine harmonics to draw (up to Nyquist-ish)
    const maxHarm = Math.max(1, Math.floor(fmax / f));
    // Normalize heights based on strongest harmonic (fundamental = 1.0 by definition)
    const H = h * 0.9; // usable height
    ctx.strokeStyle = LINE;
    ctx.globalAlpha = (typeof dimmed!=='undefined' && dimmed) ? 0.35 : 0.95;
    for(let k=1;k<=maxHarm;k++){
      const fk = f * k;
      const a  = amp(wave, k) * lin;
      if(a <= 0) continue;
      const x  = xForFreq(fk, fmin, fmax, w);
      const hh = Math.max(2, Math.min(H, H * a)); // clamp between 2px and H
      // vertical line centered on x
      ctx.lineWidth = 3; // adaptive thickness
      ctx.beginPath();
      ctx.moveTo(Math.round(x)+0.5, h);
      ctx.lineTo(Math.round(x)+0.5, h - hh);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>


<script>
(function(){
  const ISO = [20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500, 16000, 20000];
  const axis = document.getElementById('freqAxis');
  const scr = axis && axis.parentElement;
  if(!axis || !scr) return;

  function fmt(f){
    if(f>=1000){ return (f%1000===0? (f/1000)+'k' : (f/1000).toFixed(1)+'k'); }
    return String(f);
  }
  function xForFreq(f, fmin, fmax, w){
    const t = (Math.log(f) - Math.log(fmin)) / (Math.log(fmax) - Math.log(fmin));
    return Math.max(0, Math.min(1, t)) * w;
  }
  function render(){
    const rect = scr.getBoundingClientRect();
    const w = rect.width;
    const fmin = ISO[0], fmax = ISO[ISO.length-1];
    axis.innerHTML = "";
    ISO.forEach((f, idx)=>{
      const dense = w >= 520;
      const show = dense ? true : (idx % 2 === 0);
      const div = document.createElement('div');
      div.className = 'tick';
      if(!show) div.style.opacity = .45;
      const x = xForFreq(f, fmin, fmax, w);
      div.style.left = x + 'px';
      div.textContent = fmt(f);
      axis.appendChild(div);
    });
  }
  window.addEventListener('load', render);
  window.addEventListener('resize', render);
  let dpr = window.devicePixelRatio;
  setInterval(()=>{ if(window.devicePixelRatio!==dpr){ dpr=window.devicePixelRatio; render(); } }, 500);
})();
</script>


<script>
(function(){
  const cvs = document.getElementById('scope');
  if(!cvs) return;
  const ctx = cvs.getContext('2d');

  function parseDb(text){ const m = /-?\d+(\.\d+)?/.exec(text||""); return m ? parseFloat(m[0]) : -Infinity; }
  function getUI(){
    const waveText = (document.getElementById('waveRead')||{}).textContent || 'SINE';
    const freqText = (document.getElementById('freqRead')||{}).textContent || '1000 Hz';
    const volText  = (document.getElementById('volRead')||{}).textContent || 'VOL -inf dB';
    let f = 1000;
    if(/kHz/i.test(freqText)) f = parseFloat(freqText)*1000;
    else { const m = /(\d+(\.\d+)?)\s*Hz/i.exec(freqText); if(m) f = parseFloat(m[1]); }
    const db = parseDb(volText);
    const wave = (waveText||'SINE').trim().toUpperCase();
    return { wave, f, db };
  }

  function renderAnalyticIfStatic(){
    try {
      const b = document.getElementById('scopeBtn');
      const isStatic = b && /STATIC/i.test(b.textContent||"");
      if(!isStatic) return;

      const { wave, f, db } = getUI();
      const w = cvs.width, h = cvs.height;

      ctx.clearRect(0,0,w,h);
      ctx.globalAlpha = .25; ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1; ctx.beginPath();
      for(let x=0;x<w;x+=w/12){ ctx.moveTo(x,0); ctx.lineTo(x,h); }
      for(let y=0;y<h;y+=h/8){ ctx.moveTo(0,y); ctx.lineTo(w,y); }
      ctx.stroke(); ctx.globalAlpha = 1;

      const lin = isFinite(db) ? Math.pow(10, db/20) : 0;
      const A = (h*0.42) * (lin>0 ? lin : 0);

      const T = 0.010, twoPi = Math.PI*2;
      function shape(phi){
        if(wave==='SINE') return Math.sin(phi);
        if(wave==='SQUARE') return Math.sign(Math.sin(phi)) || 1;
        if(wave==='SAW'){ let t = (phi % twoPi)/twoPi; if(t<0)t+=1; return 2*t-1; }
        if(wave==='TRIANGLE'){ let t=(phi%twoPi)/twoPi; if(t<0)t+=1; return 1-4*Math.abs(t-0.5); }
        return Math.sin(phi);
      }
      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#7cc3ff';
      const omega = twoPi * f;
      for(let i=0;i<w;i++){
        const t = (i/w)*T;
        const y = h/2 - A * shape(omega*t);
        if(i===0) ctx.moveTo(i,y); else ctx.lineTo(i,y);
      }
      ctx.stroke();
    } catch(e){}
  }

  (function hook(){
    const orig = window.requestAnimationFrame;
    if(!orig || orig.__siggenPatched) return;
    function wrapped(cb){
      return orig(function(ts){ try{ cb(ts); } finally { renderAnalyticIfStatic(); } });
    }
    wrapped.__siggenPatched = true;
    window.requestAnimationFrame = wrapped;
  })();
})();
</script>


<script>
(function(){
  const cvs = document.getElementById('spectrum2');
  if(!cvs) return;
  const ctx = cvs.getContext('2d');
  const GREEN = '#00ff66', GRID = '#3a3a3a';

  function parseDb(text){ const m=/-?\d+(\.\d+)?/.exec(text||""); return m?parseFloat(m[0]):-Infinity; }
  function getUI(){
    const waveText = (document.getElementById('waveRead')||{}).textContent || 'SINE';
    const freqText = (document.getElementById('freqRead')||{}).textContent || '1000 Hz';
    const volText  = (document.getElementById('volRead')||{}).textContent || 'VOL -inf dB';
    const muteBtn  = document.getElementById('muteBtn');
    const muted    = muteBtn ? (muteBtn.getAttribute('aria-pressed')==='true') : true;
    let f = 1000;
    if(/kHz/i.test(freqText)) f = parseFloat(freqText)*1000;
    else { const m = /(\d+(\.\d+)?)\s*Hz/i.exec(freqText); if(m) f = parseFloat(m[1]); }
    const db = parseDb(volText);
    const wave = (waveText||'SINE').trim().toUpperCase();
    return { wave, f, db, muted };
  }
  function amp(wave,k){
    if(wave==='SINE') return k===1?1:0;
    if(wave==='SQUARE') return (k%2===1)?1/k:0;
    if(wave==='SAW') return 1/k;
    if(wave==='TRIANGLE') return (k%2===1)?1/(k*k):0;
    return 0;
  }
  function xForFreq(f, fmin, fmax, w){
    const t = (Math.log(f)-Math.log(fmin))/(Math.log(fmax)-Math.log(fmin));
    return Math.max(0, Math.min(1, t))*w;
  }

  function draw(){
    const {wave, f, db, muted} = getUI();
    const w=cvs.width, h=cvs.height;
    ctx.clearRect(0,0,w,h);

    const fmin=20, fmax=20000;
    const lin = isFinite(db) ? Math.pow(10, db/20) : 0;
    const padB = 14; const baseY = h - padB; const H = (h - padB)*0.9;
    ctx.strokeStyle = GREEN;
    ctx.globalAlpha = muted || !isFinite(db) ? 0.35 : 0.95;

    const maxHarm = Math.max(1, Math.floor(fmax / f));
    const lineW = 8;
    ctx.lineWidth = lineW;
    for(let k=1;k<=maxHarm;k++){
      const fk = f*k;
      const a  = amp(wave,k) * lin;
      if(a<=0) continue;
      const x  = xForFreq(fk, fmin, fmax, w);
      const hh = Math.max(2, Math.min(H, H*a));
      ctx.beginPath();
      ctx.moveTo(Math.round(x)+0.5, baseY);
      ctx.lineTo(Math.round(x)+0.5, baseY - hh);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>


<script>
(function(){
  function ensureSweepButton(){
    if(document.getElementById('sweepBtn')) return;
    var btn = document.createElement('button');
    btn.id = 'sweepBtn';
    btn.className = 'sweep';
    btn.setAttribute('aria-label','Sweep 20–20kHz');
    btn.title = 'Sweep 20–20kHz';
    Object.assign(btn.style, {
      position:'absolute',
      width:'44px', height:'44px', borderRadius:'50%', border:'none',
      background:'radial-gradient(circle at 35% 35%, #fff, #e5e5e5)',
      boxShadow:'0 1px 2px rgba(0,0,0,.2), inset 0 4px 8px rgba(0,0,0,.15)',
      cursor:'pointer',
      zIndex:'12'
    });
    // Add the S label
    btn.innerHTML = '<span style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:700;color:#444;user-select:none;">S</span>';
    // Place inside the same main container as other controls
    var host = document.querySelector('.unit') || document.body;
    host.appendChild(btn);
  }

  function placeSweep(){
    var mute = document.getElementById('muteBtn');
    var sweep = document.getElementById('sweepBtn');
    var center = document.querySelector('.knob.center');
    if(!mute || !sweep || !center) return;

    var host = sweep.offsetParent || document.querySelector('.unit') || document.body;
    var hostRect = host.getBoundingClientRect();
    var mRect = mute.getBoundingClientRect();
    var cRect = center.getBoundingClientRect();
    var sW = sweep.getBoundingClientRect().width || 44;

    var mCx = mRect.left + mRect.width/2;
    var cCx = cRect.left + cRect.width/2;
    var sCx = 2*cCx - mCx;

    var left = Math.round(sCx - sW/2 - hostRect.left);
    var top  = Math.round(mRect.top - hostRect.top);

    sweep.style.left = left + 'px';
    sweep.style.top  = top  + 'px';
  }

  function parseDb(t){ var m=/\-?\d+(\.\d+)?/.exec(t||''); return m?parseFloat(m[0]):-Infinity; }
  function isMuted(){ var m=document.getElementById('muteBtn'); return m && m.getAttribute('aria-pressed')==='true'; }
  function setScopeStatic(on){ var b=document.getElementById('scopeBtn'); if(b){ b.textContent = on?'STATIC':'DYNAMIC'; } }
  function setFreqReadout(freq){
    var el=document.getElementById('freqRead'); if(!el) return;
    if(freq>=1000){
      var k=freq/1000; el.textContent = (Math.abs(k-Math.round(k))<1e-6)? (Math.round(k)+' kHz') : (k.toFixed(2)+' kHz');
    } else {
      el.textContent = Math.round(freq) + ' Hz';
    }
  }

  function playSweep(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      var ac = new AC();
      var osc = ac.createOscillator();
      var g   = ac.createGain();
      var now = ac.currentTime, dur=4.0;
      
// Set oscillator type based on current UI waveform
var waveTxt = (document.getElementById('waveRead')||{}).textContent || 'SINE';
waveTxt = String(waveTxt).trim().toUpperCase();
var oscType = 'sine';
if(waveTxt==='SQUARE') oscType='square';
else if(waveTxt==='SAW' || waveTxt==='SAWTOOTH') oscType='sawtooth';
else if(waveTxt==='TRIANGLE') oscType='triangle';
osc.type = oscType;

// Start sweep
osc.frequency.setValueAtTime(20, now);

      osc.frequency.exponentialRampToValueAtTime(20000, now+dur);
      var dbTxt=(document.getElementById('volRead')||{}).textContent||'';
      var db=parseDb(dbTxt);
      var lin = isFinite(db)? Math.pow(10, db/20) : 0;
      // allow sweep to be audible even when Mute is ON
      g.gain.setValueAtTime(lin, now);
      osc.connect(g); g.connect(ac.destination);
      osc.start(now); osc.stop(now+dur+0.05);
      osc.onended=function(){ try{ ac.close(); }catch(e){} };
    }catch(e){ console.warn('Sweep audio failed', e); }
  }

  function driveVisuals(){
    var scopeBtn=document.getElementById('scopeBtn');
    var prevMode = scopeBtn? scopeBtn.textContent : 'DYNAMIC';
    var freqEl=document.getElementById('freqRead');
    var prevFreq = freqEl? freqEl.textContent : '';
    setScopeStatic(true);
    var start=performance.now(), durMs=4000, f0=20, f1=20000;
    function step(t){
      var el=(t-start)/durMs; if(el<0)el=0; if(el>1)el=1;
      var f = f0 * Math.pow(f1/f0, el);
      setFreqReadout(f);
      if(el<1){ requestAnimationFrame(step); }
      else { setScopeStatic(/STATIC/i.test(prevMode)); if(freqEl) freqEl.textContent=prevFreq; }
    }
    requestAnimationFrame(step);
  }

  function init(){
    ensureSweepButton();
    placeSweep();
    var sweep = document.getElementById('sweepBtn');
    if(sweep){
      sweep.addEventListener('click', function(ev){
        ev.preventDefault();
        placeSweep();   // re-align in case layout shifted
        playSweep();    // audio
        driveVisuals(); // visuals
      });
    }
  }

  window.addEventListener('load', init);
  window.addEventListener('resize', function(){ setTimeout(placeSweep, 0); });
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(placeSweep); }
})();
</script>


<script>
(function(){
  function syncSweepEnabled(){
    var muteBtn = document.getElementById('muteBtn');
    var sweep = document.getElementById('sweepBtn');
    if(!muteBtn || !sweep) return;
    var muted = (muteBtn.getAttribute('aria-pressed') === 'true');
    if(muted){
      sweep.classList.remove('sweepDisabled');
    }else{
      sweep.classList.add('sweepDisabled');
    }
  }
  // Initial sync on load
  window.addEventListener('load', syncSweepEnabled);
  // Re-sync on resize (layout changes won't affect state, but harmless)
  window.addEventListener('resize', syncSweepEnabled);
  // Observe aria-pressed changes on mute button
  window.addEventListener('load', function(){
    var muteBtn = document.getElementById('muteBtn');
    if(!muteBtn || !window.MutationObserver) return;
    var obs = new MutationObserver(syncSweepEnabled);
    obs.observe(muteBtn, { attributes:true, attributeFilter:['aria-pressed'] });
  });
})();
</script>

})();
